<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SCSP Pension Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-glow"></div>

  <main class="card">
    <header class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" fill="url(#g)"/>
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
              <stop stop-color="#7C5CFF"/>
              <stop offset="1" stop-color="#FF7A59"/>
            </linearGradient>
          </defs>
        </svg>
      </span>
      <span class="brand-name">SCSP</span>
      <span class="brand-badge">powered by Sarvam</span>
    </header>

    <p class="subtitle">Your Pension, Explained Out Loud</p>

    <div class="lang-row" id="langRow">
      <button class="lang-pill active" data-lang="en-IN">English</button>
      <button class="lang-pill" data-lang="hi-IN">हिन्दी</button>
      <button class="lang-pill" data-lang="ta-IN">தமிழ்</button>
      <button class="lang-pill" data-lang="te-IN">తెలుగు</button>
    </div>

    <div class="mic-wrap">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <button id="micBtn" class="mic-btn" aria-label="Tap to speak">
        <svg viewBox="0 0 24 24" width="46" height="46" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="currentColor"/>
          <path d="M19 11a7 7 0 0 1-14 0M12 19v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="status-row">
      <span id="statusDot" class="status-dot"></span>
      <p id="status" class="status">Tap the microphone and ask about your pension.</p>
    </div>

    <button id="repeatBtn" class="repeat-btn" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4v5h5M20 20v-5h-5M4.5 9a8 8 0 0 1 14-4.5M19.5 15a8 8 0 0 1-14 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Repeat Answer
    </button>

    <audio id="player" hidden></audio>

    <section class="transcript" aria-live="polite">
      <div id="userLine" class="line user-line" hidden></div>
      <div id="assistantLine" class="line assistant-line" hidden></div>
    </section>

    <p class="disclaimer">Fictional demo pension scheme — for demonstration only.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
